packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# pnpm settings (moved from package.json `pnpm` field — pnpm 11 reads them here).

overrides:
  lightningcss: 1.30.1
  react: "catalog:react19"
  react-dom: "catalog:react19"
  # Security (GHSA-vmh5-mc38-953g, TLS bypass via SOCKS5 ProxyAgent): force the
  # transitive undici (better-auth→vitest→jsdom) onto the patched 7-line. Caret
  # stays WITHIN v7 — `>=7.28.0` would let it jump to undici 8 (a major bump for
  # jsdom). Trips the `--prod` audit gate because vitest is an installed optional
  # peer of better-auth (ADR 0044 gate). Drop when the chain ships >=7.28 itself
  # — apps/api now ALSO depends on undici directly (ssrf-guard Agent); that dep
  # pins itself and doesn't need this override, but the caret must stay within
  # v7 either way: the guard passes an npm-undici Agent as fetch's `dispatcher`,
  # duck-typed against Node's bundled undici, so majors must move in lockstep.
  undici: "^7.28.0"
  # ── Transitive security overrides (ADR 1040) ──────────────────────────────
  # Every entry here clears a HIGH production advisory in a package nothing in
  # this repo depends on directly, so there is no version to bump and no
  # upstream release to wait for — the only lever is an override. The `undici`
  # entry above is the same mechanism and predates this block.
  #
  # MAJOR-SCOPED where two vulnerable majors coexist. A bare `js-yaml: ^4.3.0`
  # would drag `@istanbuljs/load-nyc-config` (which needs the v3 API) onto v4
  # and break it; the `name@major` form fixes each line in place. Verified
  # against the installed tree: js-yaml 3.14.2 + 4.1.1 + 4.2.0, brace-expansion
  # 1.1.15 + 5.0.6 (2.1.1 is also installed and is NOT flagged — it is not
  # overridden, because the audit, not a guess about the advisory's stated
  # range, is the oracle here).
  "js-yaml@3": "^3.15.0" # GHSA-52cp-r559-cp3m — quadratic CPU via merge-key chains
  "js-yaml@4": "^4.3.0" # same advisory, v4 line
  "brace-expansion@1": "^1.1.16" # GHSA-3jxr-9vmj-r5cp — exponential {} expansion
  "brace-expansion@5": "^5.0.8" # + GHSA-mh99-v99m-4gvg — unbounded expansion OOM
  # PERIMETRA-LOCAL, and it is the upstream block's OWN RULE being applied rather
  # than a deviation from it: "the audit, not a guess about the advisory's stated
  # range, is the oracle here". Upstream measured 2.1.1 as unflagged in ITS tree
  # and therefore left the v2 line alone. In perimetra's tree `pnpm audit --prod`
  # DOES flag it (GHSA-3jxr-9vmj-r5cp, `>=2.0.0 <2.1.2`), reached through
  # `@miklik1/cardo-tax-cz > libxmljs2 > node-gyp > … > minimatch`, a chain the
  # skeleton does not have. Same advisory as the v1 entry above, different major.
  "brace-expansion@2": "^2.1.2"
  # PERIMETRA-LOCAL for the same reason — a dependency the skeleton has no path
  # to. GHSA-hmw2-7cc7-3qxx, CRLF injection via an unescaped filename/field name,
  # reached through `@miklik1/cardo-tax-cz > saxon-js > axios > form-data`
  # (4.0.5, patched >=4.0.6). Patch-level within the same major, so no consumer
  # sees an API change.
  form-data: "^4.0.6"
  fast-uri: "^3.1.4" # GHSA-v2hh-gcrm-f6hx + GHSA-4c8g-83qw-93j6 — host confusion
  shell-quote: "^1.8.5" # GHSA-395f-4hp3-45gv — quadratic `parse()` DoS
  # THE TWO BELOW ARE NOT AUDIT-VERIFIABLE, and that is why they landed as their
  # own commit (ADR 1041). Both sit in the BUILD pipeline, and `build` runs in
  # neither the Stop-hook gate nor lefthook — so a clean advisory report after
  # these move is evidence about the advisory database and about nothing else.
  # Their acceptance criterion is a manual `pnpm build`, recorded in the ADR.
  postcss: "^8.5.23" # GHSA-6g55-p6wh-862q + GHSA-r28c-9q8g-f849 — sourceMappingURL
  #                    arbitrary .map file read / path traversal
  sharp: "^0.35.3" # GHSA-f88m-g3jw-g9cj — inherited libvips CVE-2026-33327,
  #                  -33328, -35590, -35591. This one swaps NATIVE binaries (the
  #                  prebuilt libvips that `next/image` optimization runs on), so
  #                  it is the reason the manual build is not ceremony.
  # GHSA-c96f-x56v-gq3h — HTTP/2 DDoS. In range of fastify 5.8.5's own
  # `find-my-way: ^9.0.0`, so this is a patch bump and not a forced major.
  find-my-way: "^9.6.1"
  # GHSA-83w8-p2f5-377r — route-guard bypass via path traversal, and the ONE
  # entry here that crosses a declared peer range, so it carries its own
  # argument. The fix exists only on the v10 line (`patched >=10.1.1`, no 9.x
  # backport) while `@nestjs/platform-fastify@11.1.26` and `@nestjs/swagger@11.4.4`
  # declare `^8.0.0 || ^9.0.0` and `@bull-board/fastify@7.2.1` pins `9.1.3`
  # exactly. That mismatch is a DECLARED range, not a measured incompatibility:
  # v10.0.0's entire breaking change is `setHeaders(res)` becoming
  # `setHeaders(reply)` (fastify/fastify-static#598), and NO consumer in this
  # tree passes `setHeaders` — the only occurrence is a type-only field in
  # `@nestjs/platform-fastify`'s vendored `fastify-static-options.interface.d.ts`,
  # which is a local copy and not an import, so it neither changes nor breaks
  # `check-types`. Its dependency set is otherwise identical to 9.1.3's.
  # This one MATTERS here rather than being cosmetic: the advisory is a guard
  # bypass, and the two mounts this tree gives it are the Swagger UI assets and
  # bull-board — which `apps/api/src/modules/jobs/jobs.module.ts` (the
  # `fastify.register` at ~112, behind a `safeCompare` basic-auth hook and the
  # `BULL_BOARD_ENABLED` fail-closed gate) mounts OUTSIDE Nest, i.e. exactly the
  # "a route guard protects this static mount" shape the advisory defeats.
  # (The upstream comment cites `common/config/env.ts` — that file holds only the
  # flag and the credentials in this repo; the mount itself is in the jobs module.)
  "@fastify/static": "^10.1.2"
  # Single @types/node for the whole tree (2026-06-11): without this, three
  # majors coexist (18 via testcontainers→@types/dockerode→@types/ssh2, 25 via
  # @inquirer optional peers, 22 ours) and their merged `net`/undici-types
  # globals break `tsc -p tsconfig.build.json` in apps/api (stale `Request`
  # from undici-types@5). Types-only, safe to force.
  "@types/node": "catalog:"

# Default catalog — cross-cutting deps that don't move as part of a versioned set.
catalog:
  # Typed test globals — imported explicitly in mobile Jest specs (mirrors the
  # `import { describe, it } from "vitest"` style on web). Tracks the jest 29 line.
  "@hookform/resolvers": ^5.4.0
  "@jest/globals": ^29.7.0
  # Telemetry web binding (ADR 0021): Sentry's Next.js SDK (v10 line supports
  # Next 16). Web-only — the RN SDK is a native module and lives in expo56.
  "@sentry/nextjs": ^10.56.0
  "@t3-oss/env-core": ^0.13.11
  "@t3-oss/env-nextjs": ^0.13.11
  "@tanstack/react-query": ^5.95.1
  "@testing-library/react": ^16.3.2
  # RNTL is SDK-independent (peers: jest >=29, RN >=0.71). jest-expo /
  # @react-native/jest-preset track the SDK — see the expo56 catalog.
  "@testing-library/react-native": ^13.3.3
  "@types/node": ^22.15.3
  eslint: ^9.39.1
  # jest stays on the v29 line: jest-expo 56's preset + jest-watch-typeahead
  # require jest 29, not 30 (`expo install` defaults jest to latest, so this is
  # pinned by hand).
  jest: ^29.7.0
  knip: ^6.14.2
  # Realtime transport (ADR 0029): the Centrifugo JS client behind
  # @repo/realtime's vendor-agnostic seam. Pure JS (WebSocket transport) — the
  # same package serves web and RN, so default catalog (not the expo56 set).
  centrifuge: ^5.4.0
  # API mocking for the web dev runtime + Vitest (ADR 0015). Web only for now —
  # msw/native is a maintainer-flagged WIP and mobile is dormant, so no mobile
  # mock yet (the injectable client seam lets one drop in later).
  msw: ^2.7.0
  # 16.2.12 (2026-07-28 bump, ADR 1040; was 16.2.9 from 2026-06-11, which cleared
  # the 16.2.1-era advisories). The advisory floor is 16.2.11, which clears four
  # high `pnpm audit` advisories — two Server-Action ones, the Turbopack+single-
  # locale middleware bypass and the rewrite-destination SSRF. All four
  # preconditions were RE-VERIFIED in this repo rather than inherited from the
  # skeleton's claim about itself — and this matters, because upstream is a
  # template and perimetra is a shipping app with 40+ routes: no `"use server"`
  # anywhere in `apps/web` or `packages/*`, no `i18n` key in next.config.js
  # (next-intl runs WITHOUT i18n routing — cookie-selected locale via
  # `./i18n/request.ts`, no `[locale]` segment), no `--turbopack` on any build,
  # and every `rewrites()` destination is a literal host or the server-side
  # `apiProxyTarget`. 16.2.12 is taken anyway rather than allowlisted: each of
  # those is an APPLICATION property that one commit changes, and the same
  # release also carries fixes that need none of them.
  next: 16.2.12
  # i18n engine (ADR 0020): next-intl on web (incl. RSC), its framework-agnostic
  # core use-intl on mobile, over one shared ICU catalog. `use-intl` is pinned
  # EXACT (no caret) to freeze the React Native rough edges tracked in
  # next-intl#957 — bump it deliberately, not via a caret drift.
  next-intl: ^4.13.0
  # PostHog (ADR 0028): one client shared by @repo/flags and @repo/telemetry's
  # analytics adapter. posthog-js (browser) is framework-agnostic — fine with
  # Next 16 / React 19.2; posthog-node (RSC flag eval) needs Node ^20.20 / >=22.22.
  # Both web-only — the RN SDK is a native module and lives in expo56.
  posthog-js: ^1.379.2
  posthog-node: ^5.35.14
  # Forms (ADR 0009): RHF + zod resolver. Pure-JS, no native module — identical
  # on web + RN, so default catalog (not the expo56 set).
  react-hook-form: ^7.77.0
  # TypeScript 6.0 — the Expo SDK 56 expected version (`expo install --check`);
  # typescript-eslint 8.60+ supports it (peer `typescript <6.1.0`). ADR 0013.
  typescript: ~6.0.3
  use-intl: 4.13.0
  zod: ^4.3.6
  # UI state (ADR 0010): Zustand in @repo/store. Pure-JS, web + RN.
  zustand: ^5.0.14
  "@nestjs/testing": ^11.1.26
  fastify: ^5.8.5
  # Better Auth: exact pin, CVE policy ADR 0033 (`auth` = its CLI, version-locked).
  # 1.6.25 (2026-07-28 bump, ADR 1040): GHSA-qq9h-g4jm-xgf3, account takeover via
  # pre-account hijacking on magic-link and email-OTP sign-in (patched >=1.6.22).
  # This is the highest-impact advisory in either skeleton — `better-auth` is a
  # DIRECT dependency of both `@repo/auth` and `apps/api`, not a transitive one.
  # PERIMETRA CORRECTION to the upstream comment, which says "the affected flows
  # are sign-in flows this template ships": they are NOT shipped here. The
  # advisory is specific to magic-link and email-OTP sign-in, and this repo
  # configures exactly `admin()`, `organization({ ac, roles, … })` and
  # `twoFactor({ issuer: "Perimetra" })` (`auth.instance.ts`), mirrored client-side
  # in `@repo/auth` — no magic-link or email-OTP plugin anywhere (grep-verified).
  # The bump is taken anyway, and deliberately: which plugins are enabled is an
  # APPLICATION property one commit away from false, and nine minors of drift on
  # the identity library is a worse thing to owe than a patch bump is to take.
  # `auth` is the matching CLI and moves in the same edit or the CLI generates
  # against a different schema than the runtime enforces.
  better-auth: 1.6.25
  ioredis: ^5.11.1
  auth: 1.6.25
  "@types/react": 19.2.14
  uuidv7: ^1.2.1
  nestjs-zod: ^5.4.0
  "@opentelemetry/sdk-node": 0.218.0
  "@opentelemetry/exporter-trace-otlp-http": 0.218.0
  # `http/protobuf` is the OTLP spec DEFAULT protocol, so this is the exporter
  # the trace chain builds when only OTEL_EXPORTER_OTLP_ENDPOINT is set
  # (ADR 0131 — apps/api now owns that chain and can no longer inherit the
  # exporter sdk-node used to pick for it).
  "@opentelemetry/exporter-trace-otlp-proto": 0.218.0
  "@opentelemetry/exporter-metrics-otlp-http": 0.218.0
  "@opentelemetry/instrumentation": 0.218.0
  "@opentelemetry/instrumentation-pg": 0.70.0
  "@opentelemetry/instrumentation-ioredis": 0.66.0
  "@opentelemetry/instrumentation-pino": 0.64.0
  "@fastify/otel": 0.18.1
  "@opentelemetry/api": ^1.9.1
  "@sentry/node": ^10.57.0
  "@testcontainers/postgresql": ^12.0.1
  "@testcontainers/redis": ^12.0.1
  "@nestjs/swagger": ^11.4.4

# Force `pnpm add` to honor catalogs for names already present. Note: this
# only enforces during `pnpm add` flows — hand-edits to a package.json
# (literal version for a catalog'd name) are not rejected. For repo-wide
# lint-time enforcement add syncpack when the repo crosses ~10+ packages.
# Requires pnpm 10.12.1+.
catalogMode: strict

# Named catalogs — groups of versions that move atomically. Bumping a framework
# major (Expo SDK, React major, Tailwind major) becomes a one-block edit instead
# of a hunt across every package.json.
catalogs:
  # React + types. Bumping requires moving Next/Expo/RN together — see expo56.
  # react/react-dom are pinned exact to the Expo SDK 56 expected version (no
  # caret) so `expo install --check` stays clean and web + mobile share one React.

  # Expo SDK 56 (RN 0.85 + React 19.2) + all SDK-aligned packages. The pins
  # below are the SDK-56-expected versions enforced by `expo install --check`
  # (run in CI); bump the SDK and all its pins here together — see ADR 0013.
  expo56:
    "@expo/log-box": ~56.0.12
    "@expo/metro-runtime": ~56.0.18
    # Device key/value store for the theme preference (ADR 0010 follow-up). A
    # native module, so it tracks the SDK: `expo install` resolves it from
    # bundledNativeModules (2.2.0 for SDK 56) and `expo install --check` guards it.
    "@react-native-async-storage/async-storage": 2.2.0
    # Mobile test runner (ADR 0005): jest-expo tracks the SDK (`expo install`
    # resolves it from bundledNativeModules — ~56.0.5 for SDK 56); its preset
    # extends @react-native/jest-preset, pinned to the RN line. Both bump with
    # this block, not on their own.
    "@react-native/jest-preset": ~0.85.3
    # Telemetry native binding (ADR 0021): a native module, so it lives with the
    # SDK set (peers: expo >=49, RN >=0.65 — fine for SDK 56 / RN 0.85). Seam-only
    # today: only @repo/telemetry dev-installs it for typechecking; apps/mobile
    # adds it (via `expo install`, `--check`-guarded) when mobile telemetry wires.
    "@sentry/react-native": ~8.13.0
    expo: ~56.0.17
    expo-constants: ~56.0.22
    expo-linking: ~56.0.16
    # Device locale detection for the initial mobile locale (ADR 0020). A native
    # module, so it tracks the SDK like async-storage — `expo install` resolves
    # it from bundledNativeModules (56.0.6 for SDK 56) and `--check` guards it.
    expo-localization: ~56.0.6
    expo-router: ~56.2.16
    # Splash held until the persisted theme rehydrates, to avoid a cold-start
    # theme flash (ADR 0015); a config plugin, registered in app.config.ts.
    expo-splash-screen: ~56.0.14
    expo-status-bar: ~56.0.4
    expo-system-ui: ~56.0.5
    jest-expo: ~56.0.5
    # Flags native binding (ADR 0028): a native module (peers: async-storage,
    # expo-application/device/file-system/localization — all SDK-managed), so it
    # lives with the SDK set. Seam-only today: only @repo/flags dev-installs it
    # for typechecking; apps/mobile adds it (via `expo install`, `--check`-
    # guarded) when mobile flags wire — mirrors @sentry/react-native above.
    posthog-react-native: ~4.46.11
    react-native: 0.85.3
    react-native-gesture-handler: ~2.31.1
    react-native-reanimated: 4.3.1
    react-native-safe-area-context: ~5.7.0
    react-native-screens: ~4.26.0
    react-native-web: ~0.21.0
    react-native-worklets: 0.8.3
  react19:
    "@types/react": 19.2.14
    "@types/react-dom": 19.2.3
    react: 19.2.3
    react-dom: 19.2.3

  # Tailwind v4, shared by web (CSS-first @theme) and mobile (NativeWind v5).
  # NativeWind is exact-pinned to a v5 preview (no caret) to freeze preview
  # churn — ADR 0001. `react-native-css` is NativeWind v5's runtime peer. The
  # `lightningcss` deserialize pin lives in the root `pnpm.overrides`.
  tailwind4:
    "@tailwindcss/postcss": 4.3.0
    nativewind: 5.0.0-preview.4
    react-native-css: ^3.0.7
    tailwindcss: 4.3.0

# Build-script allowlist (pnpm 11, replaces onlyBuiltDependencies/
# ignoredBuiltDependencies). Only @sentry/cli + lefthook ran scripts under the
# base repo's pnpm 10 allowlist and the suite was green — everything else ships
# prebuilds via optionalDependencies and stays false.
allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@sentry/cli": true
  "@swc/core": false
  core-js: false
  cpu-features: false
  esbuild: false
  lefthook: true
  # @cardo/tax-cz transitive (native XML for its ISDOC/UBL exporters). `true`
  # runs its prebuild-install postinstall, which fetches the prebuilt binary for
  # this platform (no from-source compile). REQUIRED even though O2-b never
  # serializes XML: the kernel's only `buildInvoice` path is `@cardo/tax-cz/export`,
  # whose index eagerly loads the exporters (and thus libxmljs2) at module init.
  libxmljs2: true
  msgpackr-extract: false
  msw: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@miklik1/cardo-tax-cz@0.1.0"
